camera:
  index: 0
  resolution:
    width: 1280
    height: 720
  fps: 30

# Advanced AI Features
ai_features:
  # Face Recognition with Learning (2025 Optimized)
  face_recognition:
    enabled: true
    model: "large"  # Options: small, large (large = 99.38% accuracy)
    tolerance: 0.5  # Lower = stricter matching (0.5 recommended for 2025)
    auto_learn_threshold: 5  # Auto-learn faces appearing this many times
    storage_dir: "data/faces"
    jitters: 1  # Number of re-samples for recognition (higher = slower but more accurate)
    use_cnn: true  # Use CNN model on GPU for better accuracy

  # Behavioral Analysis and Pattern Learning
  behavioral_analysis:
    enabled: true
    learn_normal_patterns: true
    anomaly_detection: true
    min_events_for_learning: 100  # Minimum events before learning patterns

  # Advanced Analytics
  advanced_analytics:
    enabled: true
    # Vehicle speed estimation
    speed_estimation:
      enabled: true
      pixels_per_meter: 50  # Calibration: pixels per real-world meter
    # Color detection
    color_detection:
      enabled: true
      track_vehicle_colors: true
    # Time-based pattern analysis
    time_analysis:
      enabled: true

  # Continuous Learning
  continuous_learning:
    enabled: true
    face_learning_interval: 3600  # seconds (1 hour)
    pattern_learning_interval: 7200  # seconds (2 hours)
    behavior_update_interval: 1800  # seconds (30 minutes)

  # Interactive Learning (Draw boxes & text descriptions)
  interactive_learning:
    enabled: true
    min_annotations_for_training: 10
    auto_train: false  # Automatically train when enough annotations collected

ml_model:
  type: "yolo11n"  # YOLOv11 (2025) - 4% more accurate, ~halved latency vs YOLOv8
  # Options: yolo11n, yolo11s, yolo11m, yolo11l, yolo11x
  # yolo11n: Fastest, recommended for RTX 4070 Ti real-time processing
  # yolo11s: Balanced speed/accuracy
  # yolo11m: Higher accuracy, still efficient
  confidence_threshold: 0.5
  nms_threshold: 0.4
  device: "cuda"  # Using RTX 4070 Ti GPU acceleration
  half_precision: true  # FP16 for 2x speed boost on GPU

detection:
  enable_object_detection: true
  enable_motion_detection: true
  enable_face_detection: true  # Enhanced with AI face recognition
  motion_threshold: 25
  motion_min_area: 500

  # Classes to detect (COCO dataset classes)
  target_classes:
    - person
    - car
    - truck
    - bus
    - motorcycle
    - bicycle
    - dog
    - cat
    - bird

# Reolink Integration
reolink:
  enabled: false  # Set to true to enable Reolink integration
  # NVR Configuration
  nvr:
    enabled: false
    ip: "192.168.1.100"
    username: "admin"
    password: "your_password"
    port: 554

  # Standalone Cameras
  cameras:
    # Front camera example
    - name: "front_camera"
      enabled: false
      ip: "192.168.1.101"
      username: "admin"
      password: "your_password"
      stream_type: "sub"  # main or sub
      use_camera_ai: true  # Use camera's built-in AI detections

    # Back camera example
    - name: "back_camera"
      enabled: false
      ip: "192.168.1.102"
      username: "admin"
      password: "your_password"
      stream_type: "sub"
      use_camera_ai: true

# Home Assistant Integration
home_assistant:
  enabled: false  # Set to true to enable Home Assistant MQTT
  mqtt:
    broker: "192.168.1.100"  # Your Home Assistant IP
    port: 1883
    username: ""  # Leave empty if no authentication
    password: ""
    device_name: "AI Camera System"

  # Auto-publish sensors
  auto_discovery: true

  # What to publish
  publish:
    person_detection: true
    vehicle_detection: true
    motion_detection: true
    anomaly_detection: true
    speed_data: true
    activity_level: true
    statistics: true

# License Plate Recognition (LPR/ALPR) - 2025 Optimized
license_plate_recognition:
  enabled: true
  languages: ['en']  # OCR languages: en, ch_sim, ch_tra, ja, ko, etc.
  gpu: true  # Use GPU acceleration for OCR (RTX 4070 Ti)
  confidence_threshold: 0.4  # Lowered for better detection (2025 recommendation)
  country_format: 'auto'  # Options: auto, us, uk, eu, etc.
  # EasyOCR 2025 Optimizations
  decoder: 'greedy'  # Options: greedy, beamsearch (greedy faster, 95%+ accuracy)
  beamWidth: 5  # Only used if decoder is beamsearch
  batch_size: 1  # Process one at a time for real-time
  workers: 0  # Use main process (better for GPU)
  allowlist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'  # Valid plate characters
  # Optional: Custom cascade file for plate detection
  cascade_path: null

# Email Reporting System
email_reporting:
  enabled: false  # Set to true to enable email reports

  # SMTP Configuration (works with Gmail, Outlook, custom servers, etc.)
  smtp_server: "smtp.gmail.com"  # Gmail SMTP
  # Other common servers:
  # Outlook: smtp.office365.com
  # Yahoo: smtp.mail.yahoo.com
  # Custom: your.smtp.server.com

  smtp_port: 587  # 587 for TLS, 465 for SSL, 25 for no encryption
  use_tls: true

  # Authentication
  username: "your.email@gmail.com"  # Your email address
  password: "your_app_password"  # App password (not your regular password!)
  # For Gmail: Use App Password from https://myaccount.google.com/apppasswords
  # For Outlook: Use account password or app password

  from_email: "your.email@gmail.com"  # Sender email (usually same as username)
  from_name: "AI Camera System"  # Display name for emails

  # Recipients
  recipients:
    - "recipient1@example.com"
    - "recipient2@example.com"

  # Report Schedules (all times in 24-hour format)
  schedules:
    # Daily summary report
    daily_summary:
      enabled: true
      time: "08:00"  # 8 AM every day

    # Weekly summary report
    weekly_summary:
      enabled: true
      day: "monday"  # monday, tuesday, wednesday, etc.
      time: "09:00"  # 9 AM

    # License plate activity report
    license_plate_report:
      enabled: true
      time: "18:00"  # 6 PM every day

    # Custom schedules (you can add more)
    # custom_report:
    #   enabled: false
    #   time: "12:00"

  # Instant alerts (send immediately when detected)
  instant_alerts:
    send_on_anomaly: false  # Email when anomaly detected
    send_on_suspicious_plate: false  # Email for suspicious plate patterns
    min_severity: 0.7  # Only alert if severity >= this value

# Database
database:
  enabled: true
  url: "sqlite:///data/camera_system.db"
  cleanup_days: 90  # Delete data older than this

recording:
  save_recordings: true
  recordings_path: "./recordings"
  max_recording_duration: 300  # seconds
  save_detections: true
  video_codec: "mp4v"
  # Auto-record on events
  auto_record_on_person: false
  auto_record_on_vehicle: false
  auto_record_on_anomaly: true

alerts:
  enable_alerts: true
  alert_cooldown: 60  # seconds
  alert_types:
    - motion
    - person_detected
    - vehicle_detected
    - anomaly_detected
    - unusual_time_activity

web_interface:
  port: 5000
  host: "0.0.0.0"
  enable_stream: true
  stream_quality: 80
  # Advanced dashboard
  enable_analytics_dashboard: true
  enable_graphs: true

performance:
  process_every_n_frames: 1
  max_frame_queue_size: 10
  use_threading: true
